name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Unzip Project
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_FILE" || echo "com.yatanarnaing.pos")
          
          # ၁။ ဖုန်း Screen ပေါ်တွင်ပေါ်မည့် App နာမည်ကို YATANAR POS သို့ အတင်းအကျပ် ပြောင်းလဲခြင်း
          STRINGS_FILE=$(find . -name "strings.xml" | head -n 1)
          if [ -f "$STRINGS_FILE" ]; then
            # app_name တဂ်တစ်ခုလုံးကို YATANAR POS (Mini Market) သို့ အစားထိုးပြင်ဆင်ခြင်း
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">YATANAR POS (Mini Market)</string>|g' "$STRINGS_FILE"
          fi
          
          # ၂။ activity_main.xml ဒီဇိုင်းကို တိုက်ရိုက်ဆောက်ခြင်း
          LAYOUT_FILE=$(find . -name "activity_main.xml" | head -n 1)
          if [ -f "$LAYOUT_FILE" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$LAYOUT_FILE"
            echo '<LinearLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0A1128" android:orientation="vertical" android:gravity="center" android:padding="16dp">' >> "$LAYOUT_FILE"
            echo '    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="YATANAR POS (Mini Market)" android:textColor="#FFFFFF" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>' >> "$LAYOUT_FILE"
            echo '    <Button android:id="@+id/btn_sales" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="အရောင်း" android:layout_marginBottom="12dp"/>' >> "$LAYOUT_FILE"
            echo '    <Button android:id="@+id/btn_stock" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ကုန်စင်" android:layout_marginBottom="12dp"/>' >> "$LAYOUT_FILE"
            echo '    <Button android:id="@+id/btn_barcode" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ဘားကုတ်" android:layout_marginBottom="12dp"/>' >> "$LAYOUT_FILE"
            echo '    <Button android:id="@+id/btn_report" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="အစီရင်ခံစာ"/>' >> "$LAYOUT_FILE"
            echo '</LinearLayout>' >> "$LAYOUT_FILE"
          fi

          # ၃။ MainActivity.java ကို စနစ်တကျ ပြန်လည်တည်ဆောက်ခြင်း
          MAIN_ACTIVITY=$(find . -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACTIVITY" ]; then
            echo "package $PACKAGE_NAME;" > "$MAIN_ACTIVITY"
            echo "import android.os.Bundle;" >> "$MAIN_ACTIVITY"
            echo "import androidx.appcompat.app.AppCompatActivity;" >> "$MAIN_ACTIVITY"
            echo "public class MainActivity extends AppCompatActivity {" >> "$MAIN_ACTIVITY"
            echo "    @Override" >> "$MAIN_ACTIVITY"
            echo "    protected void onCreate(Bundle savedInstanceState) {" >> "$MAIN_ACTIVITY"
            echo "        super.onCreate(savedInstanceState);" >> "$MAIN_ACTIVITY"
            echo "        int layoutId = getResources().getIdentifier(\"activity_main\", \"layout\", getPackageName());" >> "$MAIN_ACTIVITY"
            echo "        if (layoutId != 0) setContentView(layoutId);" >> "$MAIN_ACTIVITY"
            echo "    }" >> "$MAIN_ACTIVITY"
            echo "}" >> "$MAIN_ACTIVITY"
          fi
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Compile And Force Build POS APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          gradle assembleDebug --no-daemon --no-build-cache -x lint

      - name: Upload Verified POS Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-PROFESSIONAL-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
