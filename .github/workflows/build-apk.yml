name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Unzip Original Project
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          
          # Manifest ထဲက တကယ့် Package Name အစစ်ကို ရှာဖွေခြင်း
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" | head -n 1)
          if [ -f "$MANIFEST_FILE" ]; then
            PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_FILE" || echo "")
            if [ -z "$PACKAGE_NAME" ]; then
              PACKAGE_NAME=$(grep -oP 'package \K[a-zA-Z0-9_.]+' $(find . -name "MainActivity.java" | head -n 1) | tr -d ';')
            fi
          fi
          
          # ၁။ ပုံပါ ဒီဇိုင်းအတိုင်း activity_main.xml ကို ဆောက်လုပ်ခြင်း
          LAYOUT_FILE=$(find . -name "activity_main.xml" | head -n 1)
          if [ -f "$LAYOUT_FILE" ]; then
            cat << 'EOF' > "$LAYOUT_FILE"
            <?xml version="1.0" encoding="utf-8"?>
            <ScrollView xmlns:android="http://android.com"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#0B132B">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="16dp">

                    <!-- Header: MM POS Mini Market -->
                    <RelativeLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:background="#1C2541"
                        android:padding="16dp"
                        android:layout_marginBottom="16dp">
                        <TextView
                            android:id="@+id/title"
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="MM POS (Mini Market)"
                            android:textColor="#FFFFFF"
                            android:textSize="22sp"
                            android:textStyle="bold" />
                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:layout_below="@id/title"
                            android:text="ယုံကြည်၊ လွယ်ကူ၊ ယုံကြည်စိတ်ချရ"
                            android:textColor="#5BC0BE"
                            android:textSize="12sp" />
                    </RelativeLayout>

                    <!-- Row 1: အရောင်းနှင့် အမြတ် Card များ -->
                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:weightSum="2"
                        android:layout_marginBottom="12dp">

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:background="#1D3557"
                            android:padding="12dp"
                            android:layout_marginRight="6dp"
                            android:orientation="vertical">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ယနေ့အရောင်း" android:textColor="#FFFFFF"/>
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ks 1,280,500" android:textColor="#00E676" android:textSize="16sp" android:textStyle="bold"/>
                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:background="#1D3557"
                            android:padding="12dp"
                            android:layout_marginLeft="6dp"
                            android:orientation="vertical">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ယနေ့အမြတ်" android:textColor="#FFFFFF"/>
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ks 286,450" android:textColor="#FFD600" android:textSize="16sp" android:textStyle="bold"/>
                        </LinearLayout>
                    </LinearLayout>

                    <!-- Row 2: လက်ကျန်ကုန်တန်ဖိုးနှင့် ကုန်စင်မျိုးအစား -->
                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:weightSum="2"
                        android:layout_marginBottom="16dp">

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:background="#31572C"
                            android:padding="12dp"
                            android:layout_marginRight="6dp"
                            android:orientation="vertical">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="လက်ကျန်ကုန်တန်ဖိုး" android:textColor="#FFFFFF"/>
                            <TextView android:layout_width="wrap_width" android:layout_height="wrap_content" android:text="Ks 8,560,000" android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold"/>
                        </LinearLayout>

                        <LinearLayout
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:background="#E63946"
                            android:padding="12dp"
                            android:layout_marginLeft="6dp"
                            android:orientation="vertical">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ကုန်ပစ္စည်းမျိုးအစား" android:textColor="#FFFFFF"/>
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ks 3,450,000" android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold"/>
                        </LinearLayout>
                    </LinearLayout>

                    <!-- Quick Actions Buttons (အမြန်လုပ်ဆောင်ရန် ခလုတ်များ) -->
                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="လျင်မြန်စွာ လုပ်ဆောင်ရန်"
                        android:textColor="#FFFFFF"
                        android:textSize="16sp"
                        android:layout_marginBottom="8dp"/>

                    <GridLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:columnCount="4"
                        android:rowCount="1"
                        android:layout_marginBottom="16dp">
                        <Button android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="အရောင်း" android:textSize="11sp"/>
                        <Button android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ကုန်စင်" android:textSize="11sp"/>
                        <Button android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ဘားကုတ်" android:textSize="11sp"/>
                        <Button android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="အစီရင်ခံစာ" android:textSize="11sp"/>
                    </GridLayout>

                </LinearLayout>
            </ScrollView>
            EOF
          fi

          # ၂။ MainActivity.java ကို သန့်စင်ပြီး Package အမှန်ဖြင့် အစားထိုးခြင်း
          MAIN_ACTIVITY=$(find . -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACTIVITY" ]; then
            echo "package $PACKAGE_NAME;" > "$MAIN_ACTIVITY"
            echo "" >> "$MAIN_ACTIVITY"
            echo "import android.os.Bundle;" >> "$MAIN_ACTIVITY"
            echo "import androidx.appcompat.app.AppCompatActivity;" >> "$MAIN_ACTIVITY"
            echo "" >> "$MAIN_ACTIVITY"
            echo "public class MainActivity extends AppCompatActivity {" >> "$MAIN_ACTIVITY"
            echo "    @Override" >> "$MAIN_ACTIVITY"
            echo "    protected void onCreate(Bundle savedInstanceState) {" >> "$MAIN_ACTIVITY"
            echo "        super.onCreate(savedInstanceState);" >> "$MAIN_ACTIVITY"
