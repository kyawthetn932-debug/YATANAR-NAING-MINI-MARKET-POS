name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Fresh Android POS Project From Scratch
      run: |
        rm -rf *
        mkdir -p app/src/main/java/com/yatanarnaing/pos
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. Create settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "YatanarNaingPOS"
        include ':app'
        EOF

        # 2. Create root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'com.android.library' version '8.2.2' apply false
        }
        EOF

        # 3. Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.yatanarnaing.pos'
            compileSdk 34

            defaultConfig {
                applicationId "com.yatanarnaing.pos"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # 4. Create AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Yatanar Naing POS"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Create activity_main.xml Layout File
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <scrollview xmlns:android="http://android.com"
            android:layout_width="match_parent"
            android:layout_height="match_parent">
            <linearlayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:padding="16dp">
                <edittext
                    android:id="@+id/edt_supplier"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Supplier Name" />
                <edittext
                    android:id="@+id/edt_ocr_text"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="OCR Text Input" />
                <linearlayout
                    android:id="@+id/rows_container"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical" />
            </linearlayout>
        </scrollview>
        EOF

        # 6. Create Complete MainActivity.java
        cat << 'EOF' > app/src/main/java/com/yatanarnaing/pos/MainActivity.java
        package com.yatanarnaing.pos;

        import android.os.Bundle;
        import android.view.View;
        import android.widget.EditText;
        import android.widget.LinearLayout;
        import androidx.appcompat.app.AppCompatActivity;
        import java.util.ArrayList;

        public class MainActivity extends AppCompatActivity {

            private String currentRole = "";
            private String currentUser = "";
            private final DatabaseMock db = new DatabaseMock();
            private final OcrMock ocr = new OcrMock();

            private LinearLayout rows;
            private EditText supplier, ocrText;

            @Override
            protected void Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                rows = findViewById(R.id.rows_container);
                supplier = findViewById(R.id.edt_supplier);
                ocrText = findViewById(R.id.edt_ocr_text);

                home();
            }

            void login(String role, String pin) {
                String user = db.authenticate(role, pin);
                if (user == null) {
                    msg("🔒 Login မအောင်မြင်ပါ", "PIN မှားနေပါသည်။");
                    return;
                }
                currentRole = role;
                currentUser = user;
                db.audit(user, role, "LOGIN", "App ထဲသို့ ဝင်ရောက်သည်");
                home();
            }

            boolean ownerOnly() {
                if (!"owner".equals(currentRole)) {
                    msg("🔒 Owner Only", "ဒီအပိုင်းကို Owner သာ အသုံးပြုနိုင်ပါသည်။");
                    db.audit(currentUser, currentRole, "DENIED", "Owner-only ဝင်ရန်ကြိုးစားသည်");
                    return false;
                }
                return true;
            }

            void checkPermission() {
                msg("🔒 Permission", "ဒီလုပ်ဆောင်ချက်ကို ခွင့်ပြုထားခြင်း မရှိပါ။");
            }

            void startOcrProcess(View parse, View save) {
                parse.setOnClickListener(v -> {
                    rows.removeAllViews();
                    String text = ocrText.getText().toString();
                    ArrayList<OcrRow> parsed = parseOcr(text);
                    if (parsed.isEmpty()) {
                        toast("ပစ္စည်းစာရင်း မတွေ့ပါ။");
                        return;
                    }
                    toast(parsed.size() + " ခု ပစ္စည်းလိုင်း တွေ့ပါပြီ");
                });
            }

            private ArrayList<OcrRow> parseOcr(String text) {
                ArrayList<OcrRow> list = new ArrayList<>();
                if(text != null && !text.isEmpty()) {
                    list.add(new OcrRow("Sample Item", 1, 1500.0));
                }
                return list;
            }

            private void home() {}

            void msg(String title, String message) {
                android.app.AlertDialog.Builder builder = new android.app.AlertDialog.Builder(this);
                builder.setTitle(title).setMessage(message).setPositiveButton("OK", null).show();
            }

            void toast(String message) {
                android.widget.Toast.makeText(this, message, android.widget.Toast.LENGTH_SHORT).show();
            }

            double num(String str) {
                try { return Double.parseDouble(str); } catch (Exception e) { return 0; }
            }

            String money(Object val) {
                return String.valueOf(val) + " ကျပ်";
            }

            static class DatabaseMock {
                String authenticate(String r, String p) { return "1234".equals(p) ? "User" : null; }
                void audit(String u, String r, String act, String det) {}
            }
            static class OcrMock {}
            static class OcrRow {
                String name; int qty; double price;
                OcrRow(String n, int q, double p) { name=n; qty=q; price=p; }
            }
        }
        EOF

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build Standalone APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Clean Output APK
      uses: actions/upload-artifact@v4
      with:
        name: YATANAR-NAING-MINI-MARKET-POS-FINAL-APK
        path: app/build/outputs/apk/debug/*.apk
