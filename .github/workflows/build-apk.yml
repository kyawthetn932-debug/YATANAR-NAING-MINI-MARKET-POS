name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract POS project
        run: |
          unzip -o YATANAR_NAING_POS_APK_BUILD.zip
          cd pos_build_ready
          echo "Project extracted"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: pos_build_ready
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-MINI-MARKET-POS-APK
          path:pos_build_ready /app/build/outputs/apk/debug/app-debug.apk
