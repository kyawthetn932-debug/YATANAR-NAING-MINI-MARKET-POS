name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract POS project
      run: |
        unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
        echo "Project extracted"

    - name: Fix Missing Methods in MainActivity
      run: |
        TARGET_FILE="pos_build_ready/app/src/main/java/com/yatanarnaing/pos/MainActivity.java"
        if [ -f "$TARGET_FILE" ]; then
          # ဖိုင်ရဲ့ နောက်ဆုံးပိတ် တွန့်ကွင်း '}' ကို ဖြုတ်ပြီး ကုဒ်အသစ်များ အလိုအလျောက် ပေါင်းထည့်ခြင်း
          sed -i '$d' "$TARGET_FILE"
          cat << 'EOF' >> "$TARGET_FILE"

              private void msg(String title, String message) {
                  android.app.AlertDialog.Builder builder = new android.app.AlertDialog.Builder(this);
                  builder.setTitle(title).setMessage(message).setPositiveButton("OK", null).show();
              }

              private void toast(String message) {
                  android.widget.Toast.makeText(this, message, android.widget.Toast.LENGTH_SHORT).show();
              }

              private double num(String str) {
                  try { return Double.parseDouble(str); } catch (NumberFormatException e) { return 0; }
              }
          }
        EOF
          echo "MainActivity.java successfully patched!"
        else
          echo "Error: MainActivity.java not found!"
          exit 1
        fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper
      working-directory: pos_build_ready
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Enable AndroidX
      run: |
        echo "android.useAndroidX=true" >> pos_build_ready/gradle.properties
        echo "android.enableJetifier=true" >> pos_build_ready/gradle.properties

    - name: Build APK
      working-directory: pos_build_ready
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YATANAR-NAING-MINI-MARKET-POS-APK
        path: pos_build_ready/app/build/outputs/apk/debug/app-debug.apk
