name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Build Fresh POS Project
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          
          # Layout xml ဖိုင်ကို စနစ်တကျ ပြန်ဆောက်ခြင်း
          LAYOUT_FILE="$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"
          mkdir -p "$(dirname "$LAYOUT_FILE")"
          cat << 'EOF' > "$LAYOUT_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Yatanar Naing POS"
                  android:textSize="24sp"/>
          </LinearLayout>
          EOF

          # ပင်မ Java ဖိုင်ကို စနစ်တကျ ပြန်ဆောက်ခြင်း
          TARGET_FILE="$PROJECT_DIR/app/src/main/java/com/yatanarnaing/pos/MainActivity.java"
          mkdir -p "$(dirname "$TARGET_FILE")"
          cat << 'EOF' > "$TARGET_FILE"
          package com.yatanarnaing.pos;
          
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF
          
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Apply Strict AndroidX Properties
        run: |
          PROP_FILE="${{ env.PROJECT_PATH }}/gradle.properties"
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > "$PROP_FILE"

      - name: Compile And Build Standard POS APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          gradle assembleDebug --no-daemon --no-build-cache

      - name: Upload Verified POS Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-PROFESSIONAL-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
