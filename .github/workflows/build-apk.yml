name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract POS project
      run: |
        unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
        echo "Project extracted"
        ls -R

    - name: Fix Missing Methods in MainActivity
      run: |
        # MainActivity.java ဖိုင် ဘယ် Folder ထဲမှာပဲရှိရှိ ရှာဖွေခိုင်းခြင်း
        TARGET_FILE=$(find . -name "MainActivity.java" | head -n 1)
        
        if [ -n "$TARGET_FILE" ] && [ -f "$TARGET_FILE" ]; then
          echo "Found MainActivity.java at: $TARGET_FILE"
          # ဖိုင်ရဲ့ နောက်ဆုံးပိတ် တွန့်ကွင်း '}' ကို ဖြုတ်ပြီး ကုဒ်အသစ်များ ပေါင်းထည့်ခြင်း
          sed -i '$d' "$TARGET_FILE"
          cat << 'EOF' >> "$TARGET_FILE"

              private void msg(String title, String message) {
                  android.app.AlertDialog.Builder builder = new android.app.AlertDialog.Builder(this);
                  builder.setTitle(title).setMessage(message).setPositiveButton("OK", null).show();
              }

              private void toast(String message) {
                  android.widget.Toast.makeText(this, message, android.widget.Toast.LENGTH_SHORT).show();
              }

              private double num(String str) {
                  try { return Double.parseDouble(str); } catch (NumberFormatException e) { return 0; }
              }
          }
        EOF
          echo "MainActivity.java successfully patched!"
        else
          echo "Error: MainActivity.java NOT found anywhere in the repository!"
          exit 1
        fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper
      run: |
        BUILD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        cd "$BUILD_DIR"
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Enable AndroidX
      run: |
        PROP_FILE=$(find . -name "gradle.properties" | head -n 1)
        if [ -n "$PROP_FILE" ]; then
          echo "android.useAndroidX=true" >> "$PROP_FILE"
          echo "android.enableJetifier=true" >> "$PROP_FILE"
        fi

    - name: Build APK
      run: |
        BUILD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        cd "$BUILD_DIR"
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YATANAR-NAING-MINI-MARKET-POS-APK
        path: "**/build/outputs/apk/debug/*.apk"
