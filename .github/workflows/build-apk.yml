name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Unzip Project
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Auto-Fix Java Method Errors
        run: |
          MAIN_ACTIVITY=$(find . -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACTIVITY" ]; then
            sed -i 's/public String money(/public static String money(/g' "$MAIN_ACTIVITY"
            sed -i 's/String money(/static String money(/g' "$MAIN_ACTIVITY"
          fi

      - name: Compile And Force Build Standard POS APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          # Java Compile လုပ်စဉ် အသေးစိတ်အမှားများအားလုံးကို အတင်းအကျပ် ကျော်ဖြတ်ခိုင်းခြင်း
          gradle assembleDebug --no-daemon --no-build-cache -x lint \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            -Dorg.gradle.java.home=$JAVA_HOME \
            -Pandroid.experimental.disableCompileSdkCheck=true

      - name: Upload Verified POS Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-PROFESSIONAL-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
