name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Complete Android Project Files
      run: |
        rm -rf *
        mkdir -p app/src/main/java/com/yatanarnaing/pos
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. Create settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "YatanarNaingPOS"
        include ':app'
        EOF

        # 2. Create root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'com.android.library' version '8.1.1' apply false
        }
        EOF

        # 3. Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.yatanarnaing.pos'
            compileSdk 33

            defaultConfig {
                applicationId "com.yatanarnaing.pos"
                minSdk 24
                targetSdk 33
                versionCode 5
                versionName "5.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # 4. Create AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application
                android:allowBackup="true"
                android:label="ရတနာနိုင် AI-POS Pro"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Create Dynamic Layout XML File
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://android.com"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:fillViewport="true">
            <LinearLayout
                android:id="@+id/main_background"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="#F8F9FA"
                android:padding="14dp">
                <TextView
                    android:id="@+id/txt_title"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="🏪 ရတနာနိုင် Mini Market စနစ်သစ်"
                    android:textSize="22sp"
                    android:textStyle="bold"
                    android:textColor="#1E3A8A"
                    android:gravity="center"
                    android:padding="6dp"/>
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center"
                    android:layout_marginBottom="10dp">
                    <Button android:id="@+id/btn_theme_blue" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="အပြာ" android:layout_margin="2dp" android:backgroundTint="#2563EB"/>
                    <Button android:id="@+id/btn_theme_green" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="အစိမ်း" android:layout_margin="2dp" android:backgroundTint="#16A34A"/>
                    <Button android:id="@+id/btn_theme_dark" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="အမှောင်" android:layout_margin="2dp" android:backgroundTint="#1F2937"/>
                </LinearLayout>
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#FFFFFF"
                    android:padding="12dp"
                    android:layout_marginBottom="10dp">
                    <TextView
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="💡 ရာသီအလိုက် + AI ကုန်ပစ္စည်း အကြံပြုချက်"
                        android:textStyle="bold"
                        android:textColor="#EA580C"/>
                    <TextView
                        android:id="@+id/txt_seasonal_tips"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="တွက်ချက်နေသည်..."
                        android:textColor="#4B5563"
                        android:layout_marginTop="4dp"/>
                </LinearLayout>
                <EditText
                    android:id="@+id/edt_prod_name"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="ပစ္စည်းအမည် ရိုက်ပါ"/>
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:layout_marginBottom="6dp">
                    <Button android:id="@+id/btn_group_food" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="စားသောက်ကုန်" android:backgroundTint="#4B5563"/>
                    <Button android:id="@+id/btn_group_cosmetic" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="အလှကုန်" android:backgroundTint="#4B5563"/>
                </LinearLayout>
                <Button
                    android:id="@+id/btn_photo_ocr"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="📷 ဓာတ်ပုံရိုက်၍ ပစ္စည်းအမည်သွင်းမည် (OCR)"
                    android:backgroundTint="#059669"
                    android:layout_marginBottom="10dp"/>
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:layout_marginBottom="10dp">
                    <Button android:id="@+id/btn_scan_barcode" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🔍 Scan ဖတ်မည်" android:backgroundTint="#2563EB"/>
                    <Button android:id="@+id/btn_gen_barcode" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="🖨️ ဘားကုဒ် ထုတ်မည်" android:backgroundTint="#7C3AED"/>
                </LinearLayout>
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#FFFFFF"
                    android:padding="12dp"
                    android:layout_marginBottom="12dp">
                    <TextView
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📊 ဆိုင်တွင်း ကုန်လက်ကျန် စာရင်း Dashboard"
                        android:textStyle="bold"
                        android:textColor="#2563EB"/>
                    <TextView
                        android:id="@+id/txt_inventory_status"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="လက်ကျန်စာရင်းများ ပြသနေသည်..."
                        android:textColor="#1F2937"
                        android:layout_marginTop="4dp"/>
                </LinearLayout>
                <EditText
                    android:id="@+id/edt_ai_input"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="စနစ်ထဲ ထပ်ဖြည့်ချင်တာကို AI နဲ့ ဆွေးနွေးပါ..."/>
                <Button
                    android:id="@+id/btn_ask_ai"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
