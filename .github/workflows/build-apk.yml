name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Advanced Gradle Build Tool
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Extract and Audit POS Project
      run: |
        unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
        BUILD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        echo "PROJECT_DIR=$BUILD_DIR" >> $GITHUB_ENV

    - name: Apply Strict AndroidX Properties
      run: |
        PROP_FILE="${{ env.PROJECT_DIR }}/gradle.properties"
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true" > "$PROP_FILE"

    - name: Compile and Build Standard POS APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        gradle assembleDebug --no-daemon

    - name: Upload Verified POS Output APK
      uses: actions/upload-artifact@v4
      with:
        name: YATANAR-NAING-PROFESSIONAL-POS-APK
        path: "**/build/outputs/apk/debug/*.apk"
