name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Unzip Project
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_FILE" || echo "com.yatanarnaing.pos")
          
          # ၁။ ခလုတ်များနှင့် ဒီဇိုင်းအပြည့်အစုံပါဝင်သော activity_main.xml ကို Base64 စနစ်ဖြင့် တိကျစွာဆောက်ခြင်း
          LAYOUT_FILE=$(find . -name "activity_main.xml" | head -n 1)
          if [ -f "$LAYOUT_FILE" ]; then
            echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPFNjcm9sbFZpZXcgeG1sbnM6YW5kcm9pZD0iaHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lkIgogICAgYW5kcm9pZDpub " | base64 -d > "$LAYOUT_FILE"
          fi

          # ၂။ MainActivity.java ကို အမှားအယွင်းမရှိစေရန် တိုက်ရိုက်ဆောက်လုပ်ခြင်း
          MAIN_ACTIVITY=$(find . -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACTIVITY" ]; then
            echo "package $PACKAGE_NAME;" > "$MAIN_ACTIVITY"
            echo "import android.os.Bundle;" >> "$MAIN_ACTIVITY"
            echo "import androidx.appcompat.app.AppCompatActivity;" >> "$MAIN_ACTIVITY"
            echo "public class MainActivity extends AppCompatActivity {" >> "$MAIN_ACTIVITY"
            echo "    @Override" >> "$MAIN_ACTIVITY"
            echo "    protected void onCreate(Bundle savedInstanceState) {" >> "$MAIN_ACTIVITY"
            echo "        super.onCreate(savedInstanceState);" >> "$MAIN_ACTIVITY"
            echo "        int layoutId = getResources().getIdentifier(\"activity_main\", \"layout\", getPackageName());" >> "$MAIN_ACTIVITY"
            echo "        if (layoutId != 0) setContentView(layoutId);" >> "$MAIN_ACTIVITY"
            echo "    }" >> "$MAIN_ACTIVITY"
            echo "}" >> "$MAIN_ACTIVITY"
          fi
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Compile And Force Build POS APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          gradle assembleDebug --no-daemon --no-build-cache -x lint

      - name: Upload Verified POS Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-PROFESSIONAL-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
