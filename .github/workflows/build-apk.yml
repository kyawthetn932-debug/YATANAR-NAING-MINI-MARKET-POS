name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Unzip Original Project
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          
          # MainActivity.java လမ်းကြောင်းကို အတိအကျရှာပြီး ကုဒ်အသစ်ပြန်ထည့်ခြင်း
          MAIN_ACTIVITY=$(find . -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACTIVITY" ]; then
            PKG_NAME=$(grep -m 1 "package " "$MAIN_ACTIVITY")
            
            # EOF စနစ်ကို Linux ပတ်ဝန်းကျင်နှင့် ကိုက်ညီအောင် သီးသန့်ခွဲရေးခြင်း
            echo "$PKG_NAME" > "$MAIN_ACTIVITY"
            echo "" >> "$MAIN_ACTIVITY"
            echo "import android.os.Bundle;" >> "$MAIN_ACTIVITY"
            echo "import androidx.appcompat.app.AppCompatActivity;" >> "$MAIN_ACTIVITY"
            echo "" >> "$MAIN_ACTIVITY"
            echo "public class MainActivity extends AppCompatActivity {" >> "$MAIN_ACTIVITY"
            echo "    @Override" >> "$MAIN_ACTIVITY"
            echo "    protected void onCreate(Bundle savedInstanceState) {" >> "$MAIN_ACTIVITY"
            echo "        super.onCreate(savedInstanceState);" >> "$MAIN_ACTIVITY"
            echo "        int layoutId = getResources().getIdentifier(\"activity_main\", \"layout\", getPackageName());" >> "$MAIN_ACTIVITY"
            echo "        if (layoutId != 0) {" >> "$MAIN_ACTIVITY"
            echo "            setContentView(layoutId);" >> "$MAIN_ACTIVITY"
            echo "        }" >> "$MAIN_ACTIVITY"
            echo "    }" >> "$MAIN_ACTIVITY"
            echo "}" >> "$MAIN_ACTIVITY"
          fi
          
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Resolve Dependency and Formatting Conflicts
        run: |
          PROP_FILE="${{ env.PROJECT_PATH }}/gradle.properties"
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\nandroid.defaults.buildfeatures.buildconfig=true\n" > "$PROP_FILE"
          
          APP_GRADLE="${{ env.PROJECT_PATH }}/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/implementation "androidx.room:room-runtime:.*/implementation "androidx.room:room-runtime:2.6.1"/g' "$APP_GRADLE"
            sed -i 's/annotationProcessor "androidx.room:room-compiler:.*/annotationProcessor "androidx.room:room-compiler:2.6.1"/g' "$APP_GRADLE"
          fi

      - name: Compile And Build Standard POS APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          gradle assembleDebug --no-daemon --no-build-cache -x lint -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload Verified POS Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-PROFESSIONAL-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
