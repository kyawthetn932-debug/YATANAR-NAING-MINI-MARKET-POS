name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Advanced Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clean Environment and Unzip Original Project Only
        run: |
          find . -maxdepth 1 ! -name 'YATANAR_NAING_POS_APK_BUILD_FIXED.zip' ! -name '.github' ! -name '.' -exec rm -rf {} +
          unzip -o YATANAR_NAING_POS_APK_BUILD_FIXED.zip
          
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Resolve Duplicate Dependency Conflict
        run: |
          PROP_FILE="${{ env.PROJECT_PATH }}/gradle.properties"
          # ဗားရှင်းအချင်းချင်း ထပ်နေသည့် ပြဿနာများကို အတင်းအကျပ် ညှိနှိုင်းခိုင်းခြင်း
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\nandroid.defaults.buildfeatures.buildconfig=true\n" > "$PROP_FILE"
          
          # build.gradle ထဲတွင် ဗားရှင်းကို အလိုအလျောက် ပြုပြင်ခြင်း
          APP_GRADLE="${{ env.PROJECT_PATH }}/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/implementation "androidx.room:room-runtime:.*/implementation "androidx.room:room-runtime:2.6.1"/g' "$APP_GRADLE"
            sed -i 's/annotationProcessor "androidx.room:room-compiler:.*/annotationProcessor "androidx.room:room-compiler:2.6.1"/g' "$APP_GRADLE"
          fi

      - name: Compile And Build Standard POS APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          gradle assembleDebug --no-daemon --no-build-cache -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload Verified POS Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YATANAR-NAING-PROFESSIONAL-POS-APK
          path: "**/build/outputs/apk/debug/*.apk"
